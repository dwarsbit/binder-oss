<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        max-width: 420px;
        margin: 24px auto;
        padding: 0 16px;
        font:
          14px/1.6 system-ui,
          sans-serif;
        color: #1c1917;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        font: inherit;
      }
      button {
        margin-top: 8px;
        padding: 6px 14px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      #status {
        min-height: 1.5em;
        margin-top: 8px;
        font-size: 13px;
        color: #57534e;
      }
      #status.error {
        color: #b91c1c;
      }
      p.note {
        font-size: 13px;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <label for="origin" id="origin-label"></label>
    <input id="origin" type="url" spellcheck="false" />
    <button id="save" type="button"></button>
    <p id="status" role="status"></p>
    <p class="note" id="note"></p>
    <script type="module" src="./src/options.ts"></script>
  </body>
</html>
