<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 12px;
        font:
          13px/1.5 system-ui,
          sans-serif;
        color: #1c1917;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 6px 8px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fff;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #f5f5f4;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .row input {
        margin: 0;
      }
      #status {
        min-height: 1.5em;
        margin: 0 0 8px;
        font-size: 12px;
        color: #57534e;
      }
      #status.error {
        color: #b91c1c;
      }
      a {
        font-size: 12px;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <label for="binder" id="binder-label"></label>
    <select id="binder"></select>
    <button id="save-page" type="button"></button>
    <button id="save-selection" type="button"></button>
    <div class="row">
      <input type="checkbox" id="highlight-mode" />
      <label
        for="highlight-mode"
        id="highlight-mode-label"
        style="margin: 0; font-weight: 400"
      ></label>
    </div>
    <p id="status" role="status"></p>
    <a href="#" id="options-link"></a>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
